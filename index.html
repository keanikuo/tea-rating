<script type="module">
// ===== 設定 =====
const CFG = {
  apiKey: "AIzaSyDeBdKdfg0r8TWXMx8qcLjN0RnO71hIj9k",
  authDomain: "tea-rating-7a3ae.firebaseapp.com",
  projectId: "tea-rating-7a3ae",
  storageBucket: "tea-rating-7a3ae.firebasestorage.app",
  messagingSenderId: "1010777730664",
  appId: "1:1010777730664:web:c2ef8edeb7f2b9759215dd"
};
const P = new URLSearchParams(location.search);
const MOCK = P.has('mock');

const SCENTS = ['綠豆','蛋白','新栽','奶香','花香','果香','清香','蜜香','焙火香'];
const DEFECTS = [
  {k:'菁味', l:'菁味／生', d:'草青、生澀，發酵或走水不足'},
  {k:'悶味', l:'悶味', d:'不清爽，像悶過頭的熟味'},
  {k:'水味', l:'水味', d:'湯淡，喝起來像水'},
  {k:'火味', l:'火味太重', d:'焙火味蓋過茶本身的香'},
  {k:'雜味', l:'雜味', d:'其他不該有的味道'},
];
const AROMA=['無','淡','中','濃'], BSA=['無','微','中','很'], BODY=['普通','飽滿'], AFT=['無','微','明顯'], AFT2=['無','有','明顯'];
const SECTIONS = [
  {t:'聞香', q:[{f:'aroma',l:'香氣強度',v:AROMA,k:'pos'}], scents:true},
  {t:'滋味', q:[{f:'bitter',l:'苦',v:BSA,k:'neg'},{f:'astr',l:'澀',v:BSA,k:'neg'},{f:'sweet',l:'甜',v:BSA,k:'pos'},{f:'body',l:'湯感',v:BODY,k:'pos',s:'喝起來空、淡的，請到缺點勾「水味」'}]},
  {t:'餘韻', q:[{f:'huigan',l:'回甘',v:AFT,k:'pos'},{f:'huixiang',l:'回香',v:AFT2,k:'pos',s:'吞下後香氣回來'},{f:'shengjin',l:'生津',v:AFT2,k:'pos'}]},
];
const LIKES = [['love','❤️','喜歡'],['ok','👍','還可以'],['no','✕','不愛']];
const LIKE_EMO = {love:'❤️', ok:'👍', no:'✕'};
const MEDAL = ['🥇','🥈','🥉'];
const PHRASES = ['想買','回沖再試','香氣持久','入口滑順','跟前一杯很像'];
const COLS = [['aroma','香',AROMA,'p'],['bitter','苦',BSA,'n'],['astr','澀',BSA,'n'],['sweet','甜',BSA,'p'],['body','湯',BODY,'p'],['huigan','甘',AFT,'p'],['huixiang','回香',AFT2,'p'],['shengjin','津',AFT2,'p']];

// ===== 小工具 =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
const deepMerge = (a, b) => { const o = {...a}; for (const k in b) o[k] = isObj(b[k]) && isObj(a[k]) ? deepMerge(a[k], b[k]) : b[k]; return o };
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800) }
// 外觀：auto（跟著手機）→ light → dark
const THEMES = {auto: '🌓 外觀：跟著手機', light: '☀️ 外觀：淺色', dark: '🌙 外觀：深色'};
const getTheme = () => LS.get('tea:theme', 'auto');
function cycleTheme(){
  const next = {auto: 'light', light: 'dark', dark: 'auto'}[getTheme()] || 'auto';
  LS.set('tea:theme', next);
  if (next === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  toast(THEMES[next]);
}
const today = () => { const d = new Date(); return `${d.getMonth()+1}/${d.getDate()}` };

// ===== 資料層：模擬（測試用）=====
function makeMock(){
  const uid = P.get('uid') || LS.get('tea:mockuid', null) || (() => { const u = 'u' + Math.random().toString(36).slice(2, 8); LS.set('tea:mockuid', u); return u })();
  const K = p => 'mock:' + p;
  const subs = new Set();
  const rd = p => LS.get(K(p), null);
  const fire = p => subs.forEach(s => { if (s.exact ? p === s.pre : p.startsWith(s.pre)) s.fn() });
  const wr = (p, v) => { LS.set(K(p), v); fire(p) };
  addEventListener('storage', e => { if (e.key && e.key.startsWith('mock:')) fire(e.key.slice(5)) });
  const list = pre => { const o = {}; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k.startsWith(K(pre))){ const id = k.slice(K(pre).length); if (!id.includes('/')) o[id] = JSON.parse(localStorage.getItem(k)) } } return o };
  const watch = (pre, fn, exact) => { const s = {pre, fn, exact}; subs.add(s); setTimeout(fn); return () => subs.delete(s) };
  return {
    uid, mock: true,
    async getSession(c){ return rd('sessions/' + c) },
    async createSession(c, d){ wr('sessions/' + c, d) },
    async updateSession(c, p){ wr('sessions/' + c, deepMerge(rd('sessions/' + c) || {}, p)) },
    watchSession(c, cb){ return watch('sessions/' + c, () => cb(rd('sessions/' + c)), true) },
    async setMember(c, u, d){ wr(`sessions/${c}/members/${u}`, d) },
    watchMembers(c, cb){ const pre = `sessions/${c}/members/`; return watch(pre, () => cb(list(pre))) },
    async savePlayer(c, u, d){ wr(`sessions/${c}/players/${u}`, d) },
    async loadPlayer(c, u){ return rd(`sessions/${c}/players/${u}`) },
    watchPlayers(c, cb){ const pre = `sessions/${c}/players/`; return watch(pre, () => cb(list(pre))) },
    async deleteSession(c, uids){
      uids.forEach(u => { localStorage.removeItem(K(`sessions/${c}/players/${u}`)); localStorage.removeItem(K(`sessions/${c}/members/${u}`)) });
      localStorage.removeItem(K('sessions/' + c)); fire('sessions/' + c);
    },
  };
}

// ===== 資料層：Firebase =====
async function makeFirebase(){
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, {getAuth, signInAnonymously, onAuthStateChanged}, fs] = await Promise.all([
    import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')
  ]);
  const app = initializeApp(CFG);
  const auth = getAuth(app);
  let db;
  try { db = fs.initializeFirestore(app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}) }
  catch { db = fs.getFirestore(app) }
  const user = await new Promise((res, rej) => {
    const off = onAuthStateChanged(auth, u => { if (u){ off(); res(u) } else signInAnonymously(auth).catch(rej) });
  });
  const {doc, getDoc, setDoc, deleteDoc, onSnapshot, collection} = fs;
  const sd = c => doc(db, 'sessions', c);
  const mapCol = snap => { const o = {}; snap.forEach(d => o[d.id] = d.data()); return o };
  const warn = e => console.warn(e);
  return {
    uid: user.uid,
    async getSession(c){ const s = await getDoc(sd(c)); return s.exists() ? s.data() : null },
    createSession(c, d){ return setDoc(sd(c), d) },
    updateSession(c, p){ return setDoc(sd(c), p, {merge: true}) },
    watchSession(c, cb){ return onSnapshot(sd(c), s => cb(s.exists() ? s.data() : null), warn) },
    setMember(c, u, d){ return setDoc(doc(db, 'sessions', c, 'members', u), d) },
    watchMembers(c, cb){ return onSnapshot(collection(db, 'sessions', c, 'members'), s => cb(mapCol(s)), warn) },
    savePlayer(c, u, d){ return setDoc(doc(db, 'sessions', c, 'players', u), d) },
    async loadPlayer(c, u){ const s = await getDoc(doc(db, 'sessions', c, 'players', u)); return s.exists() ? s.data() : null },
    watchPlayers(c, cb){ return onSnapshot(collection(db, 'sessions', c, 'players'), s => cb(mapCol(s)), warn) },
    // 先刪每個人的評分和名單，最後才刪場次本身（規則要靠場次確認你是主揪）
    async deleteSession(c, uids){
      await Promise.all(uids.flatMap(u => [deleteDoc(doc(db, 'sessions', c, 'players', u)), deleteDoc(doc(db, 'sessions', c, 'members', u))]));
      await deleteDoc(sd(c));
    },
  };
}

const S = {
  api: null, name: LS.get('tea:name', ''), code: null, sess: null,
  members: {}, me: {ratings: {}, top: []}, players: {},
  cur: 1, view: 'loading', tab: 'mine', sort: 'cup', filter: null,
  unsubs: [], playersUnsub: null, pendingCode: null, newCups: 20,
};
const isHost = () => S.sess && S.api && S.sess.hostUid === S.api.uid;
const cupsArr = () => Array.from({length: S.sess?.cups || 0}, (_, i) => i + 1);
const R = n => S.me.ratings[String(n)] || {};
function rated(r){
  if (!r) return false;
  for (const k in r){
    if (k === 't') continue;
    const v = r[k];
    if (k === 'note' ? String(v || '').trim() : isObj(v) ? Object.keys(v).length : v != null) return true;
  }
  return false;
}
const doneCount = () => cupsArr().filter(n => rated(R(n))).length;
const linkFor = code => {
  const u = new URL(location.origin + location.pathname);
  u.searchParams.set('s', code);
  if (MOCK) u.searchParams.set('mock', '1');
  return u.toString();
};
function setUrl(code){
  const u = new URL(location.href);
  if (code) u.searchParams.set('s', code); else u.searchParams.delete('s');
  history.replaceState(null, '', u);
}

// ===== 儲存 =====
let saveT, lastDone = -1, saveSeq = 0;
function setSave(t){ const el = $('#savest'); if (el) el.textContent = t }
function save(){
  clearTimeout(saveT);
  setSave('儲存中…');
  saveT = setTimeout(async () => {
    const seq = ++saveSeq;
    const offT = setTimeout(() => { if (seq === saveSeq) setSave('目前離線，已存在手機，連上網路後會自動同步') }, 3000);
    try {
      const d = doneCount();
      const jobs = [S.api.savePlayer(S.code, S.api.uid, {name: S.name, ratings: S.me.ratings, top: S.me.top, t: Date.now()})];
      if (d !== lastDone){ lastDone = d; jobs.push(S.api.setMember(S.code, S.api.uid, {name: S.name, done: d, t: Date.now()})) }
      await Promise.all(jobs);
      clearTimeout(offT);
      if (seq === saveSeq) setSave('已同步 ✓');
    } catch (e){ clearTimeout(offT); console.warn(e); setSave('同步失敗，稍後會再試') }
  }, 500);
}
function upd(fn){
  const n = String(S.cur);
  const r = S.me.ratings[n] || (S.me.ratings[n] = {});
  fn(r); r.t = Date.now();
  save();
}

function closeSession(){

let loadToken = null;
function showLoading(code){
  loadToken = code; S.view = 'loading'; render();
  setTimeout(() => {
    if (loadToken !== code || S.view !== 'loading') return;
    $('#app').innerHTML = `<div class="center">網路有點慢，還在連線中…<br><br>
      <button class="btn" style="max-width:240px;margin:auto" data-act="retryLoad" data-code="${esc(code)}">重試</button>
      <button class="btn ghost" style="max-width:240px;margin:8px auto 0" data-act="home">回首頁</button></div>`;
  }, 6000);
}
async function openSession(code, fresh){
  code = String(code || '').trim().toUpperCase();
  if (!code) return;
  if (!S.name){ S.pendingCode = code; S.view = 'name'; return render() }
  let sess = fresh, player = null;
  if (!fresh){
    showLoading(code);
    // 場次和自己的評分同時讀，少等一次網路
    [sess, player] = await Promise.all([
      S.api.getSession(code).catch(e => { console.warn(e); return null }),
      S.api.loadPlayer(code, S.api.uid).catch(e => { console.warn(e); return null }),
    ]);
    if (loadToken !== code) return; // 使用者已經離開這個畫面
    loadToken = null;
    if (!sess){ setUrl(null); S.view = 'home'; render(); return toast('找不到這個場次代碼') }
  }
  closeSession();
  S.code = code; S.sess = sess;
  if (player) S.me = {ratings: player.ratings || {}, top: player.top || []};
  S.cur = Math.min(LS.get('tea:cur:' + code, 1), sess.cups) || 1;
  lastDone = doneCount();
  S.api.setMember(code, S.api.uid, {name: S.name, done: lastDone, t: Date.now()}).catch(console.warn);
  addRecent(code, sess.name);
  setUrl(code);
  S.unsubs.push(S.api.watchSession(code, s => {
    if (!s){
      if (S.code === code && !S.deleting){ removeRecent(code); closeSession(); setUrl(null); closeModal(); S.view = 'home'; render(); toast('主揪已經刪除這個場次') }
      return;
    }
    S.sess = s;
    if (s.revealed && !S.playersUnsub) S.playersUnsub = S.api.watchPlayers(code, m => { S.players = m; if (S.view === 'over') softRender() });
    softRender();
  }));
  S.unsubs.push(S.api.watchMembers(code, m => { S.members = m; if (S.view === 'over') softRender() }));
  S.view = 'rate'; render();
}
async function createSession(){
  const name = ($('#nsName')?.value || '').trim() || `${today()} 品茶`;
  const cups = Math.max(1, Math.min(60, S.newCups));
  // 6 碼有 8 億多種組合，不另外查重複
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const code = Array.from({length: 6}, () => A[Math.floor(Math.random() * A.length)]).join('');
  const data = {name, cups, blind: false, revealed: false, hostUid: S.api.uid, hostName: S.name, cupInfo: {}, createdAt: Date.now()};
  // 不等伺服器確認，先進場次；資料會在背景同步
  S.api.createSession(code, data).catch(e => { console.warn(e); toast('場次同步失敗，請檢查網路') });
  await openSession(code, data);
  openShare();
}

function cellFor(r, c){
  const [f, , labs, k] = c;
  const v = r[f];
  if (v == null) return '<td class="e">·</td>';
  const lv = f === 'body' ? v * 2 : labs.length === 3 ? [0, 2, 3][v] : v;
  return `<td class="h${k}${lv}">${labs[v]}</td>`;
}
function sortedCups(){
  const arr = cupsArr();
  const top = S.me.top.map(Number);
  const likeScore = r => ({love: 3, ok: 2, no: 0})[r.like] ?? 1;
  const num = (r, f) => r[f] ?? -1;
  const by = {
    cup: () => 0,
    like: (a, b) => { const ta = top.indexOf(a), tb = top.indexOf(b); if (ta !== tb) return (ta < 0 ? 9 : ta) - (tb < 0 ? 9 : tb); return likeScore(R(b)) - likeScore(R(a)) },
    aroma: (a, b) => num(R(b), 'aroma') - num(R(a), 'aroma'),
    clean: (a, b) => { const f = r => r.bitter == null && r.astr == null ? 99 : (r.bitter || 0) + (r.astr || 0); return f(R(a)) - f(R(b)) },
    after: (a, b) => { const f = r => (r.huigan || 0) + (r.huixiang || 0) + (r.shengjin || 0); return f(R(b)) - f(R(a)) },
  }[S.sort] || (() => 0);
  let list = arr.slice().sort((a, b) => by(a, b) || a - b);
  if (S.filter) list = list.filter(n => (R(n).scents || {})[S.filter]);
  return list;
}

    <div class="tw"><table>

function crowd(){
  const players = Object.values(S.players);
  const rows = cupsArr().map(n => {
    const k = String(n);
    let pts = 0, love = 0, ok = 0, no = 0, raters = 0;
    const medals = [], sc = {}, likes = [];
    players.forEach(p => {
      const r = (p.ratings || {})[k];
      const ti = (p.top || []).map(String).indexOf(k);
      if (ti >= 0 && ti < 3){ pts += 3 - ti; medals.push(MEDAL[ti] + esc(p.name)) }
      if (r && rated(r)){
        raters++;
        if (r.like === 'love') love++; else if (r.like === 'ok') ok++; else if (r.like === 'no') no++;
        Object.keys(r.scents || {}).forEach(s => sc[s] = (sc[s] || 0) + 1);
      }
      likes.push([p.name, r?.like, ti]);
    });
    const consensus = Object.entries(sc).filter(([, c]) => raters && c >= Math.max(2, Math.ceil(raters / 2))).sort((a, b) => b[1] - a[1]).map(([s]) => s);
    return {n, pts, love, ok, no, raters, medals, consensus, likes};
  });
  return {players, rows};
}

function viewAll(){
  const s = S.sess, mem = Object.entries(S.members);
  const total = s.cups;
  const memList = mem.length ? mem.sort((a, b) => (a[1].name || '').localeCompare(b[1].name || '')).map(([u, m]) => `<div class="mem"><span>${esc(m.name)}${u === s.hostUid ? ' <small>主揪</small>' : ''}${u === S.api.uid ? ' <small>（你）</small>' : ''}</span><small>已評 ${m.done || 0} / ${total} 杯</small></div>`).join('') : '<div class="empty">還沒有人加入</div>';
  if (!s.revealed){
    return `<section class="card"><h2>參加的人（${mem.length}）</h2>${memList}</section>
    <section class="card">
      ${isHost()
        ? `<h2>揭曉前，填上每杯的製作日期</h2>
           <div class="dates">${cupsArr().map(n => `<label><b>${n}</b><input class="cupdate" id="cd${n}" data-n="${n}" value="${esc((s.cupInfo || {})[n]?.date || '')}" placeholder="例：10/28 冬茶"></label>`).join('')}</div>
           <p style="margin:12px 0;font-size:14px;color:var(--muted)">日期打完會自動儲存，不用每格都填。揭曉之前，每個人只看得到自己的評分；按下揭曉後，大家會看到所有人的結果和製作日期。</p><button class="btn" data-act="reveal">揭曉結果</button>`
        : `<div class="empty">等主揪按「揭曉」之後，<br>這裡會顯示所有人的結果</div>`}
    </section>`;
  }
  const {players, rows} = crowd();
  const rank = rows.filter(x => x.pts || x.love).sort((a, b) => b.pts - a.pts || b.love - a.love || b.ok - a.ok || a.n - b.n);
  const contro = rows.filter(x => x.love && x.no);
  const rkHtml = rank.length ? rank.map((x, i) => `<div class="rk" data-act="go" data-n="${x.n}">
      <div class="no"><small>第 ${i + 1} 名</small>${x.n}</div>
      <div class="bd"><b>第 ${x.n} 杯</b>${(s.cupInfo || {})[x.n]?.date ? `　${esc(s.cupInfo[x.n].date)}` : ''}<br>
        ❤️ ${x.love}　👍 ${x.ok}　✕ ${x.no}${x.consensus.length ? `<br>大家都聞到：${x.consensus.map(esc).join('、')}` : ''}
        ${x.medals.length ? `<br>${x.medals.join('　')}` : ''}</div>
      <div class="pts">${x.pts}<small>分</small></div></div>`).join('') : '<div class="empty">還沒有人選前三名或按 ❤️</div>';
  const names = players.map(p => p.name);
  const detail = `<div class="tw"><table><thead><tr><th>杯</th>${names.map(nm => `<th>${esc(nm)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(x => `<tr data-act="go" data-n="${x.n}"><td class="cn">${x.n}</td>${x.likes.map(([, l, ti]) => `<td>${ti >= 0 && ti < 3 ? MEDAL[ti] : ''}${LIKE_EMO[l] || '<span style="color:var(--line)">·</span>'}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>`;
  return `<section class="card"><h2>綜合排名</h2>${rkHtml}<p class="hint">🥇 3 分、🥈 2 分、🥉 1 分，同分看 ❤️ 數</p></section>
    ${contro.length ? `<section class="card"><h2>爭議杯</h2><p style="margin:0;font-size:15px">有人 ❤️ 也有人 ✕：${contro.map(x => `<b>第 ${x.n} 杯</b>`).join('、')}</p></section>` : ''}
    <section class="card"><h2>每個人的感覺</h2>${detail}</section>
    <section class="card"><h2>參加的人（${mem.length}）</h2>${memList}</section>`;
}

function viewOver(){
  return `<header class="top">
    <button class="icon" data-act="back">‹ 評分</button>
    <div class="title">總覽</div>
    <button class="icon" data-act="menu" aria-label="選單">☰</button>
  </header>
  <div class="tabs"><button class="${S.tab === 'mine' ? 'on' : ''}" data-act="tab" data-k="mine">我的</button><button class="${S.tab === 'all' ? 'on' : ''}" data-act="tab" data-k="all">大家${S.sess.revealed ? '' : '（未揭曉）'}</button></div>
  ${S.tab === 'mine' ? viewMine() : viewAll()}`;
}

// ===== 彈出視窗 =====
function modal(html){ const m = $('#modal'); m.innerHTML = `<div class="sheet">${html}</div>`; m.hidden = false }
function closeModal(){ const m = $('#modal'); m.hidden = true; m.innerHTML = '' }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal() });

function openGrid(){
  modal(`<h3>跳到第幾杯<button data-act="close">✕</button></h3>
    <div class="grid">${cupsArr().map(i => { const r = R(i); return `<button class="gcell ${rated(r) ? 'done' : ''} ${i === S.cur ? 'cur' : ''}" data-act="go" data-n="${i}">${i}<i>${LIKE_EMO[r.like] || ''}</i></button>` }).join('')}</div>
    <p class="legend">綠底＝評過了　❤️👍✕＝整體感覺</p>`);
}
function openMenu(){
  const s = S.sess;
  modal(`<h3>${esc(s.name)}<button data-act="close">✕</button></h3>
    <button class="mitem" data-act="share">📲 邀請朋友加入（QR Code）</button>
    ${isHost() ? `<button class="mitem" data-act="addCup">➕ 加一杯（目前 ${s.cups} 杯）</button>` : ''}
    <button class="mitem" data-act="rename">✏️ 改我的名字（${esc(S.name)}）</button>
    <button class="mitem" data-act="theme">${THEMES[getTheme()]}<small style="color:var(--muted);font-size:13px">　點一下切換</small></button>
    <button class="mitem" data-act="home">🏠 回首頁</button>
    ${isHost() ? `<button class="mitem danger" data-act="delSession">🗑 刪除這個場次</button>` : ''}`);
}
let qrLib;
function loadQR(){
  if (qrLib) return qrLib;
  qrLib = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc) });
  qrLib.catch(() => qrLib = null);
  return qrLib;
}
function openShare(){
  const url = linkFor(S.code);
  modal(`<h3>邀請朋友<button data-act="close">✕</button></h3>
    <div id="qr"></div>
    <div class="code">${S.code}</div>
    <div class="link">${esc(url)}</div>
    <button class="btn" data-act="copy">複製連結</button>
    ${navigator.share ? '<button class="btn ghost" data-act="nshare">用 LINE 等 App 分享</button>' : ''}
    <button class="btn ghost" data-act="close">開始評分</button>`);
  loadQR().then(() => { const el = $('#qr'); if (el && window.QRCode) new QRCode(el, {text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M}) }).catch(() => {});
}

// ===== 操作 =====
function goCup(n){
  n = Math.max(1, Math.min(S.sess.cups, Number(n)));
  S.cur = n; LS.set('tea:cur:' + S.code, n);
  closeModal();
  const was = S.view; S.view = 'rate';
  render();
  if (was === 'rate') window.scrollTo(0, 0);
}
const ACT = {
  saveName(){ const v = ($('#nmIn').value || '').trim(); if (!v) return toast('請輸入名字'); S.name = v; LS.set('tea:name', v); if (S.pendingCode){ const c = S.pendingCode; S.pendingCode = null; openSession(c) } else { S.view = 'home'; render() } },
  rename(){
    const v = (prompt('你的名字', S.name) || '').trim(); if (!v) return;
    S.name = v; LS.set('tea:name', v); closeModal();
    if (S.code){ lastDone = -1; save() }
    render();
  },
  nc(b){ S.newCups = Math.max(1, Math.min(60, S.newCups + Number(b.dataset.d))); keepHomeInputs(render) },
  ncSet(b){ S.newCups = Number(b.dataset.n); keepHomeInputs(render) },
  create(){ createSession() },
  join(){ const c = ($('#jnCode').value || '').trim(); if (c.length < 6) return toast('代碼是 6 碼'); openSession(c) },
  open(b){ openSession(b.dataset.code) },
  seg(b){ const f = b.dataset.f, v = Number(b.dataset.v); upd(r => { if (r[f] === v) delete r[f]; else r[f] = v }); render() },
  chip(b){ const f = b.dataset.f, k = b.dataset.k; upd(r => { const m = r[f] || (r[f] = {}); const lv = ((m[k] || 0) + 1) % 3; if (lv) m[k] = lv; else delete m[k]; if (!Object.keys(m).length) delete r[f] }); render() },
  addScent(){ const v = (prompt('自訂香型（例：桂花）') || '').trim().replace(/[.\/\[\]*`~]/g, ''); if (!v) return; upd(r => { (r.scents || (r.scents = {}))[v] = 1 }); render() },
  like(b){ const v = b.dataset.v; upd(r => { if (r.like === v) delete r.like; else r.like = v }); if (v === 'no') S.me.top = S.me.top.filter(x => Number(x) !== S.cur); render() },
  phrase(b){ const ta = $('#note'); const cur = ta.value.trim(); ta.value = cur ? cur + '，' + b.dataset.p : b.dataset.p; upd(r => r.note = ta.value); render() },
  go(b){ goCup(b.dataset.n) },
  prev(){ if (S.cur > 1) goCup(S.cur - 1) },
  next(){ if (S.cur < S.sess.cups) goCup(S.cur + 1); else toast('這是最後一杯了') },
  grid(){ openGrid() },
  menu(){ openMenu() },
  close(){ closeModal() },
  over(){ S.view = 'over'; render() },
  back(){ S.view = 'rate'; render() },
  tab(b){ S.tab = b.dataset.k; render() },
  sort(b){ S.sort = b.dataset.k; render() },
  filter(b){ S.filter = b.dataset.k || null; render() },
  pick(b){ const n = Number(b.dataset.n); let t = S.me.top.map(Number); if (t.includes(n)) t = t.filter(x => x !== n); else { if (t.length >= 3) return toast('前三名已選滿，先點上面的名次移除'); t.push(n) } S.me.top = t; save(); render() },
  unpick(b){ const n = Number(b.dataset.n); S.me.top = S.me.top.map(Number).filter(x => x !== n); save(); render() },
  share(){ openShare() },
  async copy(){ try { await navigator.clipboard.writeText(linkFor(S.code)); toast('已複製連結') } catch { prompt('複製這個連結', linkFor(S.code)) } },
  nshare(){ navigator.share({title: S.sess.name, text: `一起來評茶！代碼 ${S.code}`, url: linkFor(S.code)}).catch(() => {}) },
  addCup(){ S.api.updateSession(S.code, {cups: S.sess.cups + 1}).then(() => toast(`已加到 ${S.sess.cups} 杯`)).catch(() => toast('加杯失敗')); closeModal() },
  toggleBlind(){ S.api.updateSession(S.code, {blind: !S.sess.blind}); closeModal() },
  reveal(){ if (!confirm('揭曉之後，大家都會看到所有人的評分，確定嗎？')) return; S.api.updateSession(S.code, {revealed: true}).catch(() => toast('揭曉失敗')) },
  retryLoad(b){ openSession(b.dataset.code) },
  home(){ loadToken = null; closeModal(); closeSession(); setUrl(null); S.view = 'home'; render() },
  theme(b){
    cycleTheme();
    if (b.classList.contains('mitem')) b.innerHTML = `${THEMES[getTheme()]}<small style="color:var(--muted);font-size:13px">　點一下切換</small>`;
    else if (S.view === 'home') keepHomeInputs(render);
  },
  forget(b){ removeRecent(b.dataset.code); keepHomeInputs(render) },
  async delSession(){
    if (!isHost()) return;
    if (!confirm(`確定要刪除「${S.sess.name}」嗎？\n所有人的評分都會一起刪掉，無法復原。`)) return;
    const code = S.code, uids = [...new Set([...Object.keys(S.members), S.api.uid])];
    clearTimeout(saveT);
    S.deleting = true; closeModal(); toast('刪除中…');
    try {
      await S.api.deleteSession(code, uids);
      removeRecent(code); closeSession(); setUrl(null); S.view = 'home'; render(); toast('已刪除場次');
    } catch (e){ console.warn(e); toast('刪除失敗，請確認網路') }
    S.deleting = false;
  },
};
function keepHomeInputs(fn){
  const n = $('#nsName')?.value, b = $('#nsBlind')?.checked, j = $('#jnCode')?.value;
  fn();
  if ($('#nsName')) $('#nsName').value = n || '';
  if ($('#nsBlind')) $('#nsBlind').checked = !!b;
  if ($('#jnCode')) $('#jnCode').value = j || '';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'DETAILS') return;
  const f = ACT[b.dataset.act];
  if (f){ e.preventDefault(); f(b, e) }
});
document.addEventListener('input', e => {
  if (e.target.id === 'note'){ const v = e.target.value; upd(r => { if (v) r.note = v; else delete r.note }) }
});
document.addEventListener('change', e => {
  if (e.target.classList.contains('cupdate') && isHost()){
    const n = e.target.dataset.n, v = e.target.value.trim();
    S.api.updateSession(S.code, {cupInfo: {[n]: {date: v}}}).catch(() => toast('儲存日期失敗'));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'jnCode') ACT.join();
  if (e.key === 'Enter' && e.target.id === 'nmIn') ACT.saveName();
});
// 左右滑動切換杯子
let tx = null, ty = 0;
document.addEventListener('touchstart', e => {
  if (S.view !== 'rate' || e.target.closest('textarea,input,.strip,.chips,.tw')) { tx = null; return }
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive: true});
document.addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2){ dx < 0 ? ACT.next() : ACT.prev() }
}, {passive: true});

// ===== 啟動 =====
(async function boot(){
  try { S.api = MOCK ? makeMock() : await makeFirebase() }
  catch (e){
    console.error(e);
    $('#app').innerHTML = `<div class="center">連不上資料庫，請確認網路後重新整理。<br><br><button class="btn" style="max-width:240px;margin:auto" onclick="location.reload()">重新整理</button><p style="font-size:12px;margin-top:16px">${esc(e && e.message || e)}</p></div>`;
    return;
  }
  const code = P.get('s');
  if (code) openSession(code);
  else { S.view = S.name ? 'home' : 'name'; render() }
})();
</script>
</body>
